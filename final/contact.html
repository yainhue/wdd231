<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Lumina</title>
    <meta name="author" content="Yain Huento">
    <meta name="description"
        content="Get in touch with Lumina for support, inquiries, or collaborations. We're here to help you capture your story.">
    <meta property="og:title" content="Contact Lumina">
    <meta property="og:description"
        content="Reach out to Lumina for support, inquiries, or collaborations. We're here to help.">
    <meta property="og:image" content="https://yainhue.github.io/wdd231/final/images/hero.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yainhue.github.io/wdd231/final/">
    <script type="module" src="scripts/contact.mjs"></script>
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="icon" href="images/favicon.ico">
</head>

<body>
    <header>
        <div class="logo-wrapper">
            <div class="span-wrapper">
                <img src="images/logo.png" alt="Logo of Lumina" class="logo">
            </div>
            <button class="hamburger-icon" aria-label="Open menu"></button>
        </div>
        <nav id="base-nav">
            <ul class="nav-list">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./catalog.html">Catalog</a></li>
                <li><a href="./contact.html" id="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="catalog-h1">Get In Touch</h1>
        <div class="divider-line"></div>
        <div class="contact-div">
            <form method="get" action="thankyou.html" id="form">

                <h2>Personal information</h2>
                <label>First Name<span class="required"> *</span><input type="text" name="first" required
                        autocomplete="given-name" title="Your First Name"></label>
                <label>Last Name<span class="required"> *</span><input type="text" name="last" required
                        autocomplete="family-name" title="Your Last Name"></label>
                <label>Email<span class="required"> *</span><input type="email" name="email" required
                        placeholder="john89@gmail.com" title="Your Email" autocomplete="email"></label>

                <!-- <div class="card-separator"></div> -->

                <h2>Message</h2>

                <label>Camera Model:<span class="required"> *</span>
                    <select id="membership-lvl" name="membership-lvl" required>
                        <option value="" disabled selected>Choose Camera Model</option>
                    </select></label>

                <label>Message<span class="required"> *</span>
                    <textarea id="message" name="message" rows="4" title="Your message" required></textarea></label>

                <input type="hidden" id="timestamp" name="timestamp">


                <input type="submit" value="Send Message">

            </form>
            <div class="map-div"><img src="images/map.webp" alt="A map showing Lumina's location" qloading="lazy">
                <div class="contact-info-div">
                    <h2>Contact Information</h2>
                    <div class="divider-line" id="contact-info-line"></div>
                    <p> 📱 123-456-7890</p>
                    <p>📩 lumina@example.org</p>
                    <p>📍123 Camera St., CA</p>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <div class="copyright-wrapper">
            <p>Lumina</p>
            <p id="currentyear">currentyear</p>
        </div>
        <div class="socials-wrapper">
            <a href="#">
                <img src="images/youtube.svg" alt="Youtube Icon">
            </a>
            <a href="#">
                <img src="images/twitter.svg" alt="Twitter Icon">
            </a>
            <a href="#">
                <img src="images/linkedin.svg" alt="Linkedin Icon">
            </a>
        </div>
        <div class="class-details">
            <p>WDD231 Final Project</p>
            <p id="lastmod-date">lastmod-date</p>
            <a href="https://www.youtube.com/watch?v=oQyh8R2tDM8">Video Demostration</a>
        </div>
    </footer>
</body>

</html>
